[project]
name = "cash-tracker"
version = "0.1.0"
description = "FastAPI + HTMX cash tracker. Portfolio piece for AWS deployment with Terraform, Docker, CI/CD, and observability."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Juan Manuel Bermúdez Escobar" }
]
dependencies = [
    "fastapi>=0.118,<0.120",
    "uvicorn[standard]>=0.30,<0.40",
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "alembic>=1.13,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "pytest-asyncio>=0.23,<1.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.7,<1.0",
    "mypy>=1.11,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
